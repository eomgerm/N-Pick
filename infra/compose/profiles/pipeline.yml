# 단계별 실행 설정. 수치는 Gate D 미동결. 단계 목록·치명 여부는 FRD §5.1 확정값.
# 오케스트레이터(Airflow 등) 도입 시 retry/timeout/placement 는 그쪽으로 옮기고 여기서 뺀다.
# 단계 목록·fatal 은 FRD 계약이라 그대로 유지한다.

version: 0
frozen: false

defaults:
  retry_count: null
  timeout_seconds: null
  concurrency: null

stages:
  - { name: scene_detection,          fatal: true,  retry_count: null, timeout_seconds: null }
  - { name: frame_extraction,         fatal: true,  retry_count: null, timeout_seconds: null }
  - { name: vlm_metadata,             fatal: false, retry_count: null, timeout_seconds: null }
  - { name: ocr,                      fatal: false, retry_count: null, timeout_seconds: null }
  - { name: transcript_selection,     fatal: false, retry_count: null, timeout_seconds: null }
  - { name: asr,                      fatal: false, retry_count: null, timeout_seconds: null }
  - { name: scene_transcript_mapping, fatal: false, retry_count: null, timeout_seconds: null }
  - { name: entity_extraction,        fatal: false, retry_count: null, timeout_seconds: null }
  - { name: text_embedding,           fatal: false, retry_count: null, timeout_seconds: null }
  - { name: indexing,                 fatal: true,  retry_count: null, timeout_seconds: null }

# CPU 워커 / GPU 서버 배치는 S15P21A501-88 합의 후 기록한다
placement:
  cpu_worker_stages: []
  gpu_server_stages: []
