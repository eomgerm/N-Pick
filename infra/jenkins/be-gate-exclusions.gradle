// MR 게이트(test-backend.sh)에서만 적용하는 테스트 제외 목록. build.gradle 이나 테스트 코드를
// 건드리지 않고 게이트에서만 무거운 크로스-스택 테스트를 뺀다(--init-script 로 주입).
//
// 아래 두 테스트는 BE 단독이 아니라 AI 스택과 ffmpeg 까지 같은 워크스페이스에 있어야 도는
// "live" 통합 테스트다. 각각 ../ai/.venv 의 npick_worker(파이썬)와 ffmpeg/ffprobe 바이너리를
// 실제로 실행한다. ai/.venv 는 .gitignore 대상이라 신규 Jenkins 체크아웃에는 존재하지 않고,
// temurin 툴체인 이미지에는 python·ffmpeg 이 없다. 따라서 BE 전용 게이트에서는 통과할 수 없다.
// FE 게이트가 playwright e2e 를, AI 게이트가 gpu 그룹을 빼는 것과 같은 이유로 여기서 제외한다.
// (크로스-스택 통합은 두 스택을 함께 빌드하는 별도 잡에서 돌려야 한다.)
allprojects {
    tasks.withType(Test).configureEach {
        filter {
            excludeTestsMatching "com.npick.pipeline.WorkerHttpIntegrationTest"
            excludeTestsMatching "com.npick.pipeline.WorkerRetryHttpIntegrationTest"
        }
    }
}
