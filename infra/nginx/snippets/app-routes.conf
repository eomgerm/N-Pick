# 상한은 Gate D 미동결. infra/compose/profiles/media.yml 이 정본이고 api 가 검증한다
client_max_body_size 0;

location /api/ {
    proxy_pass http://npick_api;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# api 의 X-Accel-Redirect 대상(FR-RES-013). api 구현 전이라 아직 쓰이지 않는다
location /internal-media/ {
    internal;
    alias /srv/npick/media/;
}

# MLflow 는 기본이 무인증이다. 공개 경로에 붙이므로 basic auth 를 앞에 둔다.
# htpasswd 는 커밋되지 않는다. 배포 환경에서 직접 만든다(infra/compose/README.md).
# MLflow 서버가 --static-prefix /mlflow 로 뜨므로 경로를 그대로 넘긴다.
location /mlflow/ {
    auth_basic           "MLflow";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://npick_mlflow;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Jenkins 는 compose 밖 컨테이너다(docker run). upstream 블록으로 쓰면 nginx 가 기동
# 시점에 이름을 해석해서, Jenkins 가 없을 때 nginx 자체가 뜨지 못한다. 변수 proxy_pass 로
# 요청 시점에 해석하게 해 결합을 끊는다. Jenkins 부재 시 /jenkins/ 만 502 가 된다.
#
# Jenkins 가 --prefix=/jenkins 로 뜨므로 원본 URI 를 그대로 넘긴다. 변수를 쓰면 nginx 가
# location 매칭 경로를 자동으로 붙여주지 않아 $request_uri 를 명시해야 한다.
location /jenkins/ {
    resolver 127.0.0.11 valid=10s;
    set $jenkins_upstream http://jenkins:8080;
    proxy_pass $jenkins_upstream$request_uri;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location / {
    proxy_pass http://npick_web;
    include /etc/nginx/snippets/proxy-headers.conf;
}
