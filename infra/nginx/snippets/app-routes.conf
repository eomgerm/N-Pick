# 상한은 Gate D 미동결. infra/compose/profiles/media.yml 이 정본이고 api 가 검증한다
client_max_body_size 0;

# **upstream 블록을 쓰지 않는다.** nginx 는 `upstream { server backend:8080; }` 의 이름을
# 설정 로드 시점에 한 번만 푼다. compose 가 backend 만 재생성하면 컨테이너 IP 가 바뀌는데
# nginx 는 옛 IP 를 계속 물고 있어 `/api/*` 전체가 502 가 된다 — 2026-09-17 배포 이후
# 실제로 그렇게 죽어 있었고, verify.sh 가 nginx 를 거치지 않는 경로만 봐서 통과시켰다.
# 변수 proxy_pass 는 요청 시점에 아래 resolver 로 다시 푼다. 원래 /jenkins/ 하나에만
# 쓰던 방식을 전부로 넓힌 것이다 (S15P21A501-187).
#
# ipv6=off: Docker 내장 DNS 는 AAAA 를 묻는 족족 빈 응답을 주는데, 그게 없는 이름에서는
# 해석 실패로 기록되어 로그가 지저분해진다. A 레코드만 쓴다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 변수를 쓰면 nginx 가 location 매칭 경로를 자동으로 붙여주지 않는다. $request_uri 를
# 명시해야 원래의 `proxy_pass http://npick_api;` 와 같은 경로가 넘어간다.
location /api/ {
    set $api_upstream http://backend:8080;
    proxy_pass $api_upstream$request_uri;

    # API 는 리다이렉트를 내지 않는다(인증 실패도 401 JSON 이다). 그래도 나간다면 브라우저가
    # 따라가면서 세션 쿠키·CSRF 헤더·업로드 본문을 새 대상으로 재전송한다. fetch 는 클라이언트
    # 쪽 redirect: 'error' 로 막지만(frontend/src/lib/api/client.ts), 업로드 진행률 때문에
    # XHR 로 보내는 영상 등록은 막을 수단이 없어 여기서 끊는다 (S15P21A501-325).
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @api_redirect_blocked;

    include /etc/nginx/snippets/proxy-headers.conf;
}

location @api_redirect_blocked {
    return 502;
}

# api 의 X-Accel-Redirect 대상(FR-RES-013). /api/v1/media/{clip_id} 가 인증·경로 해석·Range
# 검증을 마친 뒤 이 location 으로 위임한다. internal 이라 클라이언트가 직접 열 수 없다
location /internal-media/ {
    internal;
    alias /srv/npick/media/;
}

# MLflow 는 기본이 무인증이다. 공개 경로에 붙이므로 basic auth 를 앞에 둔다.
# htpasswd 는 커밋되지 않는다. 배포 환경에서 직접 만든다(infra/compose/README.md).
# MLflow 서버가 --static-prefix /mlflow 로 뜨므로 경로를 그대로 넘긴다.
location /mlflow/ {
    auth_basic           "MLflow";
    auth_basic_user_file /etc/nginx/htpasswd;
    set $mlflow_upstream http://mlflow:5000;
    proxy_pass $mlflow_upstream$request_uri;
    include /etc/nginx/snippets/proxy-headers.conf;
}

# Jenkins 는 compose 밖 컨테이너다(docker run). 이 방식이라 Jenkins 가 없어도 nginx 가
# 뜨고, 부재 시 /jenkins/ 만 502 가 된다. Jenkins 가 --prefix=/jenkins 로 뜨므로 원본
# URI 를 그대로 넘긴다.
location /jenkins/ {
    set $jenkins_upstream http://jenkins:8080;
    proxy_pass $jenkins_upstream$request_uri;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location / {
    set $web_upstream http://frontend:3000;
    proxy_pass $web_upstream$request_uri;
    include /etc/nginx/snippets/proxy-headers.conf;
}
