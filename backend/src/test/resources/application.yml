# 엔티티·리포지토리가 0개라 테스트에서 검증할 DB 대상이 없다. 테스트가 Postgres 를
# 요구하지 않도록 DataSource/JPA 자동설정을 끈다(DataSource 가 없으면 Flyway 도 뜨지 않는다).
# 엔티티가 생기면 Testcontainers 도입 여부를 정하고 이 파일을 지운다.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

  # 이 파일이 메인 application.yml 을 통째로 가린다. 질의 리졸버 base-url 이 없으면
  # 컨텍스트가 뜨지 않으므로, 실제로 호출되지 않을 더미 주소를 준다.
  http:
    serviceclient:
      queryResolver:
        base-url: http://localhost:1
