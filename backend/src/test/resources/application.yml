# 일반 컨텍스트 테스트는 Repository를 대체하고 DB 없이 실행한다.
# 영속성 테스트는 이 제외 설정을 해제하고 명시적으로 제공한 전용 PostgreSQL DB를 사용한다.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# 테스트 컨텍스트는 main 의 application.yml 을 읽지 않는다(같은 이름이 test 쪽으로 가려진다).
# 단어 검색 설정은 부팅 시점에 검증되므로 여기서도 값을 준다. 실제 기본값 검증은
# SceneCandidateConfigurationTest 가 main 의 application.yml 을 직접 읽어서 한다.
npick:
  search:
    candidate:
      config-version: test-candidate
      caption-weight: 1.0
      transcript-weight: 1.0
      ocr-weight: 1.0
      pool-size: 50
