# 기존 위반이 있는 규칙은 FreezingArchRule 로 현재 상태를 store 에 베이스라인한다(커밋된 store 사용).
# allowStoreCreation=false: store 를 못 찾거나 규칙 설명이 바뀌어 키가 어긋나면 조용히 새 베이스라인을 만들지 않고
# 실패시킨다 — 게이트가 조용히 무력화되는 것을 막는다. 새 freeze 규칙을 처음 추가할 때만 일시적으로 true 로 켠다.
freeze.store.default.allowStoreCreation=false
# -201 에서 clip↔pipeline 순환·tag_evidence 를 정리하면 기존 위반이 줄어 베이스라인과 어긋난다.
# 그때 한 번 freeze.refreeze=true 로 재베이스라인한 뒤 다시 false 로 되돌린다.
freeze.refreeze=false
# 베이스라인을 소스와 함께 버전 관리한다. 워킹 디렉터리(backend/) 기준 상대 경로.
freeze.store.default.path=src/test/resources/archunit_store
