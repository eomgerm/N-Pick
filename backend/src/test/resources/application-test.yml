# 테스트 전용 오버라이드. 프로파일 파일이라 main 의 application.yml 을 가리지 않고 그 위에 덮는다.
# 활성화는 build.gradle 의 test 태스크가 한다(spring.profiles.active=test).
#
# 이전에는 이 자리에 application.yml 이 있었는데, 클래스패스에서 main 의 같은 이름 파일을
# 통째로 가려 운영 Flyway·JPA 설정이 테스트에서 한 번도 검증되지 않았다. 그래서 이름을 바꿨다.
#
# DB 는 Testcontainers 가 띄운 일회용 PostgreSQL 이다(com.npick.support.NpickPostgres).
# 접속 정보는 각 테스트의 @DynamicPropertySource 가 넣는다. 도커가 없으면 스킵이 아니라 실패한다.
spring:
  datasource:
    hikari:
      # 테스트 클래스마다 Spring 컨텍스트가 하나씩 캐시되고, 컨텍스트마다 pool 이 idle 커넥션을
      # 그대로 붙들고 있다. Hikari 기본값(maximum-pool-size 10, minimum-idle 도 같은 값)이면
      # 컨텍스트 열 몇 개만으로 PostgreSQL 기본 max_connections 100 을 넘겨
      # "sorry, too many clients already" 로 뒤에 도는 클래스가 통째로 실패한다.
      # 테스트 한 건이 동시에 쓰는 커넥션은 많아야 둘셋이므로 상한만 낮춘다.
      maximum-pool-size: 5
  jpa:
    hibernate:
      # local·prod 프로파일과 같은 값. 엔티티 매핑이 baseline 과 어긋나면 부팅에서 잡는다.
      ddl-auto: validate
  http:
    serviceclient:
      # 테스트가 실제 리졸버에 닿지 않게 못 닿는 주소를 명시한다. base-url 이 비면 컨텍스트는
      # 떠도 호출할 때 상대 URI 로 실패한다.
      # 그룹 이름(queryResolver)이 QueryResolverClientConfig 와 어긋나면 조용히 미설정 상태가
      # 되므로 QueryResolverClientWiringTest 가 그 이름을 검증한다.
      queryResolver:
        base-url: http://localhost:1

# main 의 cors 블록은 local 프로파일 전용이라 test 에서는 비어 모든 Origin 이 거부된다.
# RequestIdTracingHttpTest 의 CORS 검증(preflight 허용·X-Request-Id expose)이 성립하도록 허용 출처를 고정한다.
cors:
  allowed-origins: http://localhost:3000
