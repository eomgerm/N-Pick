# 프로필별 설정을 이 파일 하나에서 관리한다.
# `---` 로 나뉜 아래 문서는 spring.config.activate.on-profile 에 적힌 프로필이
# 활성일 때만 위 공통 문서에 덮어쓰기로 합쳐진다.
spring:
  application:
    name: npick
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: npick
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 스키마는 DB 프로비저닝이 만든다(compose 의 postgres-init). Flyway 는 만들지 않는다.
    default-schema: npick
    schemas: npick
    create-schemas: false
    validate-on-migrate: true
    clean-disabled: true

  http:
    serviceclient:
      # 질의 리졸버(FastAPI) 호출 설정. 이 값만 바꿔 local 리졸버와 승인된 GMS 를 교체한다
      # (S15P21A501-45, 02-container 요소 표).
      queryResolver:
        base-url: ${QUERY_RESOLVER_BASE_URL:http://localhost:8000}
        # TODO(Gate B): 아래 timeout 은 잠정값이다. 검색 p95 목표에 맞춰 벤치마크로 동결한다.
        # FR-QRY-023: 재시도는 하지 않는다. read timeout 이면 그대로 실패한다.
        connect-timeout: ${QUERY_RESOLVER_CONNECT_TIMEOUT:1s}
        read-timeout: ${QUERY_RESOLVER_TIMEOUT:3s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

---
# 로컬 개발 (기본 프로필)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/npick}
    username: ${LOCAL_DB_USERNAME:npick}
    # 기본값 없음. .env 의 POSTGRES_PASSWORD 를 그대로 넘긴다(README 참고).
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.npick: DEBUG

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${LOCAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# 배포. 민감값은 기본값 없이 환경 변수로만 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.npick: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
