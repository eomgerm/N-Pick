# 프로필별 설정을 이 파일 하나에서 관리한다.
# `---` 로 나뉜 아래 문서는 spring.config.activate.on-profile 에 적힌 프로필이
# 활성일 때만 위 공통 문서에 덮어쓰기로 합쳐진다.
spring:
  application:
    name: npick
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: npick
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 스키마는 DB 프로비저닝이 만든다(compose 의 postgres-init). Flyway 는 만들지 않는다.
    default-schema: npick
    schemas: npick
    create-schemas: false
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

---
# 로컬 개발 (기본 프로필)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/npick}
    username: ${LOCAL_DB_USERNAME:npick}
    # 기본값 없음. .env 의 POSTGRES_PASSWORD 를 그대로 넘긴다(README 참고).
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.npick: DEBUG

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${LOCAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# 배포. 민감값은 기본값 없이 환경 변수로만 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.npick: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
