# 프로필별 설정을 이 파일 하나에서 관리한다.
# `---` 로 나뉜 아래 문서는 spring.config.activate.on-profile 에 적힌 프로필이
# 활성일 때만 위 공통 문서에 덮어쓰기로 합쳐진다.
spring:
  application:
    name: npick
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: ${CLIP_MAX_FILE_BYTES:10737418240}B
      # 영상 10GiB 외에 자막·대본·multipart 경계가 들어갈 요청 여유분 1MiB.
      # 영상 한도를 변경할 때는 전체 요청 한도도 함께 조정한다.
      max-request-size: ${CLIP_MAX_REQUEST_BYTES:10738466816}B
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: npick
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 스키마는 DB 프로비저닝이 만든다(compose 의 postgres-init). Flyway 는 만들지 않는다.
    default-schema: npick
    schemas: npick
    create-schemas: false
    validate-on-migrate: true
    clean-disabled: true

  http:
    serviceclient:
      # 질의 리졸버(FastAPI) 호출 설정. 이 값만 바꿔 local 리졸버와 승인된 GMS 를 교체한다
      # (S15P21A501-45, 02-container 요소 표).
      queryResolver:
        base-url: ${QUERY_RESOLVER_BASE_URL:http://localhost:8000}
        connect-timeout: ${QUERY_RESOLVER_CONNECT_TIMEOUT:1s}
        # read-timeout 은 리졸버 한 요청의 최악 소요보다 반드시 커야 한다. 작으면 BE 가
        # 먼저 끊어서 정규화 결과(search_tokens)를 잃고, FRD v3.1 §6.2 의 원 검색어 BM25
        # fallback 이 불가능해진다. 재시도는 하지 않으므로 이 값이 곧 상한이다.
        #
        # 최악 = 생성 8.0s (query_resolver.v1.toml 의 timeout_seconds)
        #      + 모델 digest 조회 1.0s (ollama_backend.py 의 _METADATA_TIMEOUT_SECONDS, 첫 요청만)
        #      = 9.0s. LLM timeout 하나만 보고 잡으면 첫 요청에서 그대로 잘린다.
        # 두 값 모두 실측 후 확정 대상이다 (FRD v3.1 §11).
        read-timeout: ${QUERY_RESOLVER_TIMEOUT:10s}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

# 합의한 입력 기본값은 환경변수로 덮어쓸 수 있다.
# 저장 경로 등 필수 설정이 비면 등록을 거부한다.
npick:
  pipeline:
    profile: ${NPICK_PIPELINE_PROFILE:classpath:pipeline-profile.yml}
  worker-jobs:
    enabled: ${NPICK_WORKER_JOBS_ENABLED:false}
    tokens: ${NPICK_WORKER_JOBS_TOKENS:}
    fleet: ${NPICK_WORKER_JOBS_FLEET:local}
    shared-media-volume: ${NPICK_WORKER_JOBS_SHARED_MEDIA_VOLUME:false}
  clip-registration:
    # 파서 메모리 보호용 운영 한도(byte). 시간 허용 오차와 무관하다.
    subtitle-max-bytes: ${CLIP_SUBTITLE_MAX_BYTES:10485760}
    media-root: ${CLIP_MEDIA_ROOT:${NPICK_MEDIA_ROOT:}}
    upload-root: ${CLIP_UPLOAD_ROOT:}
    probe-timeout: ${CLIP_PROBE_TIMEOUT:60s}
    # 개발용 잠정값. 실제 데이터셋의 전체 디코딩 시간 측정 후 조정한다.
    decode-timeout: ${CLIP_DECODE_TIMEOUT:30m}
    # 현재 영상 분석은 자체 GPU 사용. 외부 AI를 사용하는 실행 정의에서는 true로 변경한다.
    external-processing-required: ${CLIP_EXTERNAL_PROCESSING_REQUIRED:false}
    input:
      max-file-bytes: ${CLIP_MAX_FILE_BYTES:10737418240}
      max-duration-seconds: ${CLIP_MAX_DURATION_SECONDS:3600}
      allowed-containers: ${CLIP_ALLOWED_CONTAINERS:mp4,mov}
      allowed-video-codecs: ${CLIP_ALLOWED_VIDEO_CODECS:h264,hevc}
      allowed-audio-codecs: ${CLIP_ALLOWED_AUDIO_CODECS:aac,mp3}
  clip-media:
    # 등록과 같은 media root 를 같은 환경 변수 순서로 읽는다. 재생은 등록 실행 설정에 묶이지 않는다.
    media-root: ${CLIP_MEDIA_ROOT:${NPICK_MEDIA_ROOT:}}
    # true 면 바이트 전송을 nginx 의 location /internal-media/ 에 위임한다 (03-deployment.md §31).
    # 로컬·테스트에는 nginx 가 없으므로 기본은 애플리케이션 직접 전송이다.
    nginx-accel: ${CLIP_MEDIA_NGINX_ACCEL:false}
    internal-location: ${CLIP_MEDIA_INTERNAL_LOCATION:/internal-media/}
  search:
    # 단어 검색(BM25) 실행 설정. 아래 숫자는 모두 실측 전 잠정값이며 확정값이 아니다(FRD §11).
    # 값을 바꿀 때는 config-version 도 함께 올린다 — 그러지 않으면 다른 설정으로 돌린
    # 두 실행이 search_execution 에서 같은 설정으로 보인다.
    candidate:
      config-version: ${SEARCH_CANDIDATE_CONFIG_VERSION:candidate-v1}
      # 가중치 0 은 그 필드를 검색 대상에서 제외한다는 뜻이다. 실측 전까지 세 채널을 동일 가중으로 둔다.
      caption-weight: ${SEARCH_CANDIDATE_CAPTION_WEIGHT:1.0}
      transcript-weight: ${SEARCH_CANDIDATE_TRANSCRIPT_WEIGHT:1.0}
      ocr-weight: ${SEARCH_CANDIDATE_OCR_WEIGHT:1.0}
      # 재순위·제외 전의 후보 상한. 최종 반환 10개(F-05)와 다른 값이며 실측으로 조정한다.
      pool-size: ${SEARCH_CANDIDATE_POOL_SIZE:200}

# PostgreSQL error details may include the failing row (script, paths, secrets).
# API failures are reported through safe application error codes instead.
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

---
# 로컬 개발 (기본 프로필)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/npick}
    username: ${LOCAL_DB_USERNAME:npick}
    # 기본값 없음. .env 의 POSTGRES_PASSWORD 를 그대로 넘긴다(README 참고).
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.npick: DEBUG

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${LOCAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# 배포. 민감값은 기본값 없이 환경 변수로만 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.npick: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
