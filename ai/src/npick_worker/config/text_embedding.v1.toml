# text embedding 단계 설정 (S15P21A501-100, `stages.py` 9단계 `text_embedding`).
#
# 이 파일의 해시가 `config_version` 이다. 값을 고치면 버전이 바뀐다.
# **결과를 바꾸지 않는 값은 여기 두지 않는다.** 배치 크기·모델 경로처럼 VRAM 사정으로
# 움직이는 값이 이 파일에 있으면 `stageVersion` 이 함께 움직이고, 계약 §7 의 버전
# 불일치로 배정이 끊기거나 전 클립이 재처리 대상이 된다. 그런 값은 `settings.py` 다.
#
# 모델 이름도 여기 없다 — 가중치 식별자는 `NPICK_AI_EMBEDDING_MODEL` 이 정한다.
# 선정이 아직 동결 전이라(S15P21A501-175 잠정) 설정 파일에 박으면 모델을 바꿀 때마다
# `config_version` 이 움직여 "설정이 바뀌었나" 와 "모델이 바뀌었나" 를 구분할 수 없다.

schema = "text-embedding/v1"

# scene.embedding vector(1024) 와 **같아야 한다**
# (`backend/.../V20260907092019__baseline.sql:83`). S15P21A501-175 가 이 값으로 정했다.
# 바꾸면 전체 재색인이다 — 컬럼 타입과 이 값을 함께 고치지 않으면 INSERT 가 통째로 실패한다.
dimension = 1024

# pgvector 코사인 검색의 전제. 어댑터마다 정규화 여부가 달라 embedder 에서 통일한다.
normalize = true

# 문서측 접두. arctic-ko 는 쓰지 않는다(질의측만 `query: `). e5 계열로 갈아 끼우면
# `passage: ` 가 필요해지므로 코드가 아니라 여기서 정한다.
document_prefix = ""
