# text embedding 단계 설정 (S15P21A501-100, `stages.py` 9단계 `text_embedding`).
#
# 이 파일의 해시가 `config_version` 이다. 값을 고치면 버전이 바뀐다.
# 모델 이름은 **여기 없다** — 가중치 식별자는 환경이 정한다(`NPICK_AI_EMBEDDING_MODEL`).
# 설정 파일에 두면 모델을 바꿀 때마다 배포 이미지를 다시 만들어야 하고,
# 선정이 아직 동결 전이라(S15P21A501-175) 그 비용을 낼 이유가 없다.

schema = "text-embedding/v1"

# scene.embedding vector(1024) 와 **같아야 한다**
# (`backend/.../V20260907092019__baseline.sql:83`). S15P21A501-175 가 1024 로 확정했다.
# 바꾸면 전체 재색인이다 — 컬럼 타입과 이 값을 함께 고치지 않으면 INSERT 가 통째로 실패한다.
dimension = 1024

# pgvector 코사인 검색의 전제. 어댑터마다 정규화 여부가 달라 embedder 에서 통일한다.
normalize = true

# 문서측 접두. arctic-ko 는 쓰지 않는다(질의측만 `query: `). e5 계열로 갈아 끼우면
# `passage: ` 가 필요해지므로 코드가 아니라 여기서 정한다.
document_prefix = ""

# 캡션과 대사를 잇는 구분자. 캡션은 한 덩어리, 대사는 여러 줄이라 둘을 나눈다.
section_separator = "\n"
dialogue_separator = " "

# 어댑터가 한 번에 모델에 넣는 문장 수. VRAM 제약에서 오는 값이고 결과를 바꾸지 않는다.
# 실측 후 확정 대상이다(`ai/AGENTS.md` — 실행 설정은 FRD §11).
batch_size = 16
