# frame extraction 설정. 값이 바뀌면 version_id 가 바뀐다(FRD §7.2 기록 지원).
#
# ⚠ 아래 수치는 전부 실측 후 확정(FRD §11) 잠정값이다.
#    개발셋 측정 근거 없이 바꾸지 않는다. 근거가 생기면 이 파일을 v3 로 복사하고
#    docs/frame-extraction.md 에 변경 근거를 남긴다.
#
# 이 파일의 값이 하나라도 바뀌면 FrameExtractionConfig.version_id 가 바뀐다.
#
# 다만 version_id 는 **이 파일만** 해시한다. 설정을 그대로 두고 라이브러리를 올려도
# 선정 프레임과 인코딩 바이트가 달라질 수 있으므로 재현성 식별자는 세 필드 튜플이다:
#   같은 입력 + 같은 (version_id, engine, engine_version) = 같은 keyframe 집합
# engine 과 engine_version 은 FrameExtractionResult 에 실려 나간다.
#
# v1 과의 차이는 **장 수를 정하는 주체**다. v1 은 `interval_ms` 로 장면 길이에 비례해
# 정했고, v2 는 장면 안의 변화량으로 정한다(FRD v3.2 F-03, `docs/frd.md:131`).

schema = "frame-extract/v2"

# ── 몇 장을 뽑는가 ───────────────────────────────────────────────────
# 변화량을 재기 전에 미리 놓는 자리 수. 이 자리들 중 **서로 충분히 다른 것만** 남으므로
# 이 값은 장 수가 아니라 장 수의 후보 해상도다. 키우면 위치가 촘촘해지고 측정 비용이
# 늘지만 디코드 비용은 늘지 않는다(디코드는 어차피 0번부터 순차로 훑는다).
#
# FRD 가 말하는 "후보 수" 가 이 값이다. 원 설계(`581f6e3`)의 5 를 잠정값으로 잇는다.
planned_slots_per_scene = 5

# 하한이 1 이 아니라 2 인 이유는 FRD F-03 이 "장면의 **복수** 키프레임" 을 요구하기
# 때문이다(docs/frd.md:121). 1 로 내리면 그 요구가 설정 하나로 조용히 깨진다.
# 변화량이 아무리 작은 정적 장면이라도 이 장 수는 보장한다.
min_keyframes_per_scene = 2

# 상한. 변화량이 아무리 커도 이보다 많이 뽑지 않는다. VLM·OCR 이 이 장 수만큼
# 돌기 때문에 상한이 곧 후속 단계의 비용 상한이다.
max_keyframes_per_scene = 5

# 이 값 이상으로 달라야 새 keyframe 으로 추가한다. 0 에 가까울수록 많이 뽑힌다.
#
# 척도는 PySceneDetect `ContentDetector` 의 `content_val` 이다 — H·S·V 채널별 평균
# 절대차의 산술평균. **scene 분할이 쓰는 값과 같은 자**이고(FRD F-03 의 척도 통일 권고),
# 그래서 scene_detection.v1.toml 의 `content.threshold` 와 직접 비교할 수 있다.
#
# 값을 그 `content.threshold` 와 **같은 27.0 으로 둔다.** 뜻은 이렇다 —
#   "장면 안의 두 장을 따로 남기려면, scene 분할이 컷으로 봤을 만큼 달라야 한다."
# 그보다 덜 다르면 같은 화면의 변주이지 새로 보여 줄 그림이 아니다. 이것이 척도를
# 통일해서 얻는 것이다. 통일 전에는 임계를 분포의 골짜기에서 고를 수밖에 없었다.
#
# **자동으로 따라가지는 않는다.** 두 파일은 각자 version_id 를 갖고 따로 바뀐다.
# scene_detection 쪽 값을 바꾼다면 여기도 같이 볼지 그때 판단한다 — 재는 거리가
# 다르기 때문에(인접 프레임 대 수 초 간격) 늘 같은 값이어야 하는 것은 아니다.
#
# 샘플 2개 실측(docs/frame-extraction.md §9): 장면당 평균 2.50·2.40 장.
change_threshold = 27.0

# 변화량 계산 시 픽셀을 솎는 간격. 솎기는 평균 절대차의 불편추정이라 눈금을 바꾸지
# 않는다 — 이웃을 평균 내는 축소와 다르다. scenedetect 의 content_val 과 대조한
# 실측(프레임 720→721, 기록값 19.92)에서 지금 쓰는 stride 8 의 오차는 -0.079 다
# (19.841). 16 까지는 0.08 안쪽이고 32 에서 -1.91 로 무너진다 — 편향이 아니라
# 표본이 350 픽셀로 줄어든 것이다. 표 전체는 docs/frame-extraction.md §3.1 에 있다.
#
# `score_stride` 와 따로 두는 이유는 이쪽이 후보 평면을 들고 있어야 하는 계산이라
# 메모리가 이 값에 제곱으로 달리기 때문이다.
change_stride = 8

# ── 어디서 뽑는가 ────────────────────────────────────────────────────
# 장면 경계에서 이만큼 띄운다. 컷 직후·직전 프레임은 전환 잔상(디졸브 중간, 모션
# 블러)이 걸리기 쉽다. 구간이 짧아 여백을 양쪽에서 뺄 수 없으면 여백을 포기하고
# 구간 전체를 쓴다 — 없는 프레임을 만들 수는 없다.
#
# 원 설계의 후보 위치 0%·100% 를 잇지 않는 이유가 이것이다. 그 두 자리가 정확히
# 여기서 피하는 구간이고, 100% 는 반열린 구간 밖이다.
edge_margin_ms = 250

# 자리 하나마다 후보를 이만큼 보고 그중 점수가 가장 높은 프레임을 고른다. 1 이면
# 선명도 선정이 사라지고 자리의 중심 프레임을 그대로 쓴다.
candidates_per_slot = 3

# 후보 간 간격. 자리 중심에서 ±(step × n) 으로 벌린다.
candidate_step_ms = 120

# ── 무엇을 좋은 프레임으로 보는가 ─────────────────────────────────────
# 점수 계산 시 픽셀을 이 간격으로 건너뛰어 읽는다. 1 은 전체 픽셀이다. 원본
# 해상도 프레임 수백 장을 재는 비용을 줄이는 값이고, 선명도의 상대 순위는
# stride 를 키워도 뒤집히지 않는다(같은 stride 로 모든 후보를 재기 때문).
#
# 변화량은 이 값이 아니라 `change_stride` 로 읽는다. 두 계산의 비용 구조가 다르기
# 때문이다 — 선명도는 프레임 한 장을 재고 버리지만, 변화량은 쌍을 맞대야 해서 평면을
# 들고 있어야 한다.
score_stride = 4

# 휘도 표준편차가 이보다 낮으면 블랭크(암전·단색 전환·화이트아웃)로 보고 후보에서
# 뺀다. 자리의 후보가 전부 걸리면 그중 선명도 최고를 그냥 쓴다 — 이 단계는 치명
# 단계라 keyframe 0 장으로 끝내는 것이 블랭크 한 장보다 나쁘다.
min_luma_std = 8.0

# ── 어떻게 저장하는가 ────────────────────────────────────────────────
# **다운스케일하지 않는다.** 작은 글자 OCR 이 원본 해상도 프레임을 요구한다
# (docs/frd.md:131). 축소는 결과 카드를 만드는 시점의 몫이고 이 단계는 하지 않는다.
#
# ffmpeg mjpeg 의 qscale 이다. 2 가 최고 품질, 31 이 최저다. 0~100 척도가 아니므로
# Pillow 의 quality 와 혼동하지 않는다.
#
# 2 를 기본으로 두는 이유는 이 자산의 1차 소비자가 사람 눈이 아니라 OCR 이기
# 때문이다. 샘플 클립(800x450) keyframe 23장 평균 실측으로 qscale 2 는 프레임당
# 73 KiB, 3 은 57, 5 는 42 였다(docs/frame-extraction.md §4). 픽셀 수로 환산하면
# 1080p 에서 약 420 KiB 이고, 작은 글자 인식률을 위해 낼 만한 비용이다.
jpeg_qscale = 2
