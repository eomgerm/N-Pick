# scene detection 설정 (FR-PRC-015).
#
# ⚠ 아래 수치는 전부 Gate B(FRD §15.4) 미동결 잠정값이다.
#    개발셋 측정 근거 없이 바꾸지 않는다. 근거가 생기면 이 파일을 v2 로 복사하고
#    docs/scene-detection.md 에 변경 근거를 남긴다.
#
# 이 파일의 값이 하나라도 바뀌면 SceneDetectionConfig.version_id 가 바뀐다.
#
# 다만 version_id 는 **이 파일만** 해시한다. 설정을 그대로 두고 라이브러리를 올려도
# 경계가 달라질 수 있으므로 재현 조건은 두 축이다:
#   같은 입력 + 같은 version_id + 같은 engine_version = 같은 분할 결과
# engine_version 은 SceneDetectionResult 에 실려 나간다.

schema = "scene-detect/v1"

# content | adaptive
#   content  : 프레임 간 HSV 차이가 threshold 를 넘으면 컷. hard cut 에 강하다.
#   adaptive : 이동 평균 대비 상대 변화. 핸드헬드·빠른 팬의 오탐이 적다.
detector = "content"

# 이보다 짧은 scene 을 만들지 않는다. 카메라 플래시·1~2프레임 튐을 흡수한다.
min_scene_len_ms = 1000

# 1 = 원본 해상도. auto 를 쓰지 않는다 — 해상도에 따라 값이 달라지면
# 설정이 자기 자신을 설명하지 못하고 클립 간 비교도 깨진다.
downscale = 1

# 0 이 아니면 경계가 frame_skip 배수로 거칠어진다. 속도를 위해 올릴 수는 있다.
frame_skip = 0

[content]
# ContentDetector 기본값. 참고로 색만 바뀌는 합성 프레임은 20 근처,
# 실제 뉴스 hard cut 은 60 이상이 나온다(tests/test_scene_detection.py 측정).
threshold = 27.0
# true 면 색을 무시하고 밝기만 본다. 흑백 아카이브 영상에 쓸 수 있다.
luma_only = false

[adaptive]
# detector = "adaptive" 일 때만 쓰인다. threshold 와 스케일이 다르다(비율 기반).
adaptive_threshold = 3.0
min_content_val = 15.0
window_width = 2
