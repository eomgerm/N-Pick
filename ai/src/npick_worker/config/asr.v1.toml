# ASR 설정. 값이 바뀌면 version_id 가 바뀐다(FRD §7.2 기록 지원).
#
# 선정 근거·실측 표는 docs/asr.md §5 다. **VAD 값들은 실측으로 확정됐다**(CPU,
# 2026-09-14) — 무음·감쇠·경계 표본으로 쟀고, 아래 각 값에 어느 절이 근거인지 적었다.
# 아직 재지 않은 값(beam_size)은 그렇다고 적어 둔다. FRD §11 "실측 없이 숫자를 확정하지
# 않는다" 를 지키는 방법은 값을 비워 두는 것이 아니라 **무엇이 재어진 값이고 무엇이
# 아닌지 적어 두는 것**이다(ocr.v1.toml 과 같은 판단).
#
# version_id 는 파일 바이트가 아니라 파싱된 값을 해시한다. 주석은 configVersion 을
# 바꾸지 않지만 **값을 하나라도 고치면 바뀌므로** 그때는 v2 로 복사한다.
#
# 이 파일만 해시하므로 faster-whisper·CTranslate2 나 가중치가 바뀌면 값이 그대로인데
# 결과는 달라질 수 있다. 그래서 재현 식별자는 네 필드 튜플이다:
#   (version_id, engine, engine_version, model_version) — AsrResult 에 실려 나간다.
#
# 모델 이름과 compute type 은 여기 없다. 배포마다 다른 값이라
# settings(NPICK_AI_ASR_MODEL·NPICK_AI_ASR_COMPUTE_TYPE)에 있다 — vlm_model 과 같은
# 판단이다. 그 둘은 model_version 으로 재현 식별자에 들어간다. 모델은 실측 결과
# `large-v3-turbo` 를 쓴다(docs/asr.md §5.6). compute type 은 float16 이 CUDA 전용이라
# 아직 미정이다.

schema = "asr-config/v1"

# ── 무엇을 인식하는가 ────────────────────────────────────────────────
# 언어를 고정한다. 자동 감지를 쓰지 않는 이유는 품질이 아니라 **환각**이다 — 무음·
# 배경음만 있는 구간에서 감지가 엉뚱한 언어로 튀면 그 구간에 없는 문장이 생긴다.
# 입력은 한국어 뉴스 방송분으로 고정돼 있다(FRD §1.1).
language = "ko"

# `translate` 는 영어로 옮긴다. 대사는 원문이어야 하므로 전사만 한다.
task = "transcribe"

[decode]
# 재현성 때문에 0.0 이다. 품질 때문이 아니다 — 같은 입력에 같은 출력이 나와야
# `stageVersion` 이 "이 버전으로 만든 결과" 라는 뜻을 갖는다(계약 §7).
# **temperature fallback 을 쓰지 않는다.** faster-whisper 는 압축률·logprob 임계에
# 걸리면 온도를 올려 다시 만드는데, 그렇게 만든 문장은 근거가 약한 쪽으로 더 간다.
temperature = 0.0

# **아직 재지 않았다.** beam 을 넓히면 느려지고 짧은 발화의 회수율이 조금 오른다.
beam_size = 5

# **환각 전파를 끊는다.** 참이면 앞 구간의 전사를 다음 구간의 프롬프트로 넣는데,
# 한 번 생긴 헛문장이 그 뒤로 계속 복제되는 알려진 경로가 이것이다. 뉴스는 구간
# 사이의 문맥 의존이 낮아 잃는 것이 적다. 이 값은 실측 전이지만 **원리로 정한 값**이고
# 잠정값과 성격이 다르다.
condition_on_previous_text = false

# 단어 단위 타임스탬프. 계약이 요구하는 것은 segment 단위(s/e)뿐이라 켜지 않는다
# (계약 §4.5). 비용은 재 보니 거의 없었다(RTF 0.19 → 0.20).
#
# **small·medium 으로 배포한다면 반드시 true 로 바꾼다.** 그 둘은 무음에 둘러싸인 짧은
# 발화에 10초짜리 구간을 붙여 끝 시각이 6.5초 넘치고, 이 값을 켜면 -0.6초로 잡힌다
# (docs/asr.md §5.3). 확정 모델인 large-v3-turbo 는 켜지 않아도 맞으므로 false 다.
word_timestamps = false

# 아래 셋은 "이 구간은 발화가 아니다" 를 판정하는 임계다. faster-whisper 기본값이고
# **따로 흔들어 보지 않았다** — VAD 를 켠 상태에서 무음·잡음 표본의 환각이 이미 0 이라
# (docs/asr.md §5.2) 이 셋을 조일 이유가 없었다.
#: no_speech 확률이 이 값을 넘고 평균 logprob 이 아래 임계보다 낮으면 그 구간을 버린다.
no_speech_threshold = 0.6
log_prob_threshold = -1.0
#: 같은 말이 반복되는 출력(환각의 전형적 모양)을 걸러 내는 압축률 상한.
compression_ratio_threshold = 2.4

[vad]
# **VAD 는 ASR 실행기 안에 있다**(S15P21A501-96). 저장소에 별도 VAD 구성이 없으므로
# faster-whisper 에 내장된 Silero VAD 를 쓴다. 판정 결과는 원본 타임라인으로 되돌려
# 놓으므로 s/e 는 언제나 영상 기준이다(docs/asr.md §4 의 확인 항목).
#
# `enabled` 를 키로 둔 이유는 실험 때문이다 — VAD on/off 는 실측 비교 축이고
# (docs/asr.md §5), 어느 쪽으로 돈 실행인지는 config_version 에 남는다.
# **동봉 기본값 true 는 실측으로 확정됐다.** 끄면 무음 30초에서 "MBC 뉴스 …입니다",
# 백색잡음에서 "다음 영상에서 만나요" 가 나온다 — confidence 0.6~0.7 로, 신뢰도로는
# 걸러지지 않는다(docs/asr.md §5.2). 덤으로 켜는 쪽이 빠르다(RTF 0.36 → 0.19).
# false 로 배포하면 환각 말고도 두 가지가 더 깨진다.
# 하나는 티켓의 "VAD·무음 처리를 ASR 실행기 내부에 적용한다" 이고, 다른 하나는 발화
# 미감지 판정 자체다 — 무음을 말할 수 있는 근거가 VAD 가 남긴 오디오 길이뿐이라
# (docs/asr.md §4) VAD 를 끄면 이 단계는 `NO_SPEECH_DETECTED` 를 영영 내지 않는다.
enabled = true

#: 발화 판정 확률 임계. **재고 유지한다** — 0.3·0.5·0.7 이 감쇠 5단계에서 완전히 같은
#: 결과였고 경계 표본에서도 ±30ms 차이뿐이었다(docs/asr.md §5.3·§5.4). 이 범위에서
#: 움직일 이유가 없다.
threshold = 0.5
#: 이보다 짧은 발화 후보는 버린다. 짧은 추임새·클릭음을 거르는 자리다. Silero 기본값이고
#: 따로 흔들어 보지 않았다.
min_speech_duration_ms = 250
#: 이만큼 조용해야 발화가 끝났다고 본다. 짧으면 한 문장이 잘게 쪼개진다. **재고
#: 유지한다** — 500 으로 낮춰도 경계·표준 표본 어디서도 차이가 없었다(docs/asr.md §5.5).
min_silence_duration_ms = 2000
#: 판정된 발화 앞뒤로 붙이는 여유. 어두·어미가 잘리는 것을 막는다. 경계 표본에서 시작
#: 시각이 정확히 이만큼 앞선 것으로 확인됐다(docs/asr.md §5.3).
speech_pad_ms = 400
#: 한 발화 덩어리의 상한(초). Whisper 의 입력 창이 30초라 그보다 긴 덩어리는 어차피
#: 안에서 잘린다 — 임의로 고른 수가 아니라 모델 구조에서 온 값이다.
max_speech_duration_s = 30.0
