# OCR 설정. 값이 바뀌면 version_id 가 바뀐다(FRD §7.2 기록 지원).
#
# 선정 근거·실측 표는 docs/ocr.md 다. 아래 수치는 **샘플 클립 한 편(800x450)에서
# 실측한 값**이고, FRD §11 이 요구하는 "실측 없이 숫자를 확정하지 않는다" 를 그
# 표본 안에서 지킨 것이다. 1080p 방송분이 들어오면 다시 재고 이 파일을 v2 로
# 복사한다.
#
# 이 파일만 해시하므로 rapidocr·onnxruntime 이나 모델 가중치가 바뀌면 값이 그대로인데
# 결과는 달라질 수 있다. 그래서 재현 식별자는 네 필드 튜플이다:
#   (version_id, engine, engine_version, tokenizer) — OcrResult 에 실려 나간다.

schema = "ocr/v1"

# ── 어떤 모델로 읽는가 ────────────────────────────────────────────────
# PP-OCRv5 계열. 인식 모델은 paddleocr 가 lang="korean" 에서 쓰는 것과 같은
# `korean_PP-OCRv5_rec_mobile` 이고, 여기서는 그 ONNX 판을 onnxruntime 으로 돌린다.
ocr_version = "PP-OCRv5"

# 검출 모델의 언어 계열. PP-OCRv5 검출기는 언어별로 갈리지 않고 `ch` 하나가
# 다국어 공용이다 — 한국어 화면에 그대로 쓴다.
det_lang = "ch"
det_model_type = "mobile"
rec_lang = "korean"
rec_model_type = "mobile"

# ── 어디까지 검출하는가 ──────────────────────────────────────────────
# 검출기에 넣기 전 이미지 크기를 맞춘다. `max` 는 긴 변을 이 값에 맞춰 **줄이는**
# 쪽이다(짧은 변 기준으로 키우는 `min` 과 반대).
#
# **이 축소는 인식 품질과 무관하다.** 검출기가 찾은 상자는 원본 좌표로 되돌아오고,
# 인식은 원본 이미지에서 잘라낸 조각으로 한다. FRD 가 요구하는 "작은 글자는 축소된
# 이미지가 아니라 원본 해상도 프레임"(docs/frd.md:131)은 인식 쪽 이야기이고 그건
# 지켜진다. 여기서 잃을 수 있는 것은 "작은 글자를 **찾아내는가**" 뿐이다.
#
# 960 은 샘플(800x450)에서 아무것도 하지 않는 값이다 — 긴 변이 이미 960 미만이라
# 축소가 일어나지 않는다. 그래서 이 값은 실측으로 확정된 것이 아니다.
# **1080p 가 들어오면 실제 축소가 걸리므로 그때 다시 잰다**(docs/ocr.md §6).
det_limit_type = "max"
det_limit_side_len = 960

# DB 확률 맵을 이진화하는 문턱.
det_thresh = 0.3

# 상자 하나의 평균 점수 하한. 낮추면 흐린 글자를 더 잡지만 오독이 함께 는다 —
# 0.3 으로 낮춘 스윕에서 재현율은 23→25 인데 명백한 오탐이 1→10 건이 됐다.
det_box_thresh = 0.6

# 검출된 다각형을 바깥으로 부풀리는 배율. 글자가 상자 경계에서 잘리는 것을 막는다.
det_unclip_ratio = 1.5

# 확률 맵에 팽창을 걸어 끊긴 획을 잇는다. 샘플에서는 켜면 이웃한 별개 문구가
# 한 상자로 붙었다("강원도"+"대표 볼거리관"). 끈 쪽이 재현율이 높았다.
det_use_dilation = false

# ── 무엇을 검증된 값으로 보는가 ───────────────────────────────────────
# 이 값 미만인 관측은 `unverified` 로 표시한다. **버리지 않는다** — 검색 후보로는
# 쓸 수 있어야 하고(티켓 제약), `ocr_observation.raw_text` 는 "절대 덮어쓰지 않는다"
# 가 컬럼 주석이다.
#
# 실측으로 정한 값이다(docs/ocr.md §5). 샘플 keyframe 23 장에서 나온 관측 44 건을
# 사람이 적은 ground truth 와 대조해 임계값을 훑었다. 정답 27 건, 오독 17 건이다.
#
#   임계값   검증됨   그중 정답   unverified   그중 오독   잃은 정답
#     0.60      34        27           10          10         0
#     0.65      34        27           10          10         0
#   * 0.70      32        27           12          12         0
#     0.75      32        27           12          12         0
#     0.80      28        24           16          13         3
#
# 0.80 이 무너지는 자리다 — 거기서 처음으로 맞게 읽은 것이 unverified 로 떨어진다.
# 0.70~0.75 는 이 표본에서 결과가 같고, 둘 중 낮은 쪽을 골랐다. 임계값을 올려 얻는
# 것(오독 12 → 13)보다 잃는 것(정답 3 건이 근거에서 빠진다)이 크기 때문이다.
#
# 이 구간에서 unverified 로 표시되는 12 건은 **전부 오독**이다. 즉 이 값은 맞게 읽은
# 것을 하나도 깎지 않으면서 오독 17 건 중 12 건(71%)을 걸러낸다.
min_confidence = 0.70
