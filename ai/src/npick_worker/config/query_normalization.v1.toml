# ── 일부러 넣지 않은 범주 ───────────────────────────────────────────
#
# 시설명(인천국제공항/인천공항, 서울대학교/서울대 …)
#   1) 코퍼스 근거가 얇다. 인천공항 5 / 인천국제공항 1, 김포국제공항 0 수준이다.
#   2) 이미 `tag` 테이블이 같은 일을 한다 — tag_type 에 facility 가 있고
#      match_value(매칭용 정규화 값)와 name(화면 표시값)이 분리되어 있다.
#      여기에 중복으로 두면 두 사전이 어긋난다.
#   3) FRD F-05 3번이 "인물·기관·장소·시설" 구조화를 AI 해석기에 배정했다.
#
# 인물명(문재인 75 / 문재인 대통령 60 / 문 대통령 27)
#   성만으로는 동일인을 보장할 수 없고, 인물 사전은 시의성 때문에 계속 늙는다.
#   위와 같은 이유로 resolver 몫이다.
#
# 숫자 표기
#   이 코퍼스는 음성인식 기반이라 "코로나 일구"(479) · "사 차 대유행" 처럼 숫자를
#   한글로 적는다. 아라비아 숫자 표기는 0 건이다. 키보드로 치는 우리 사용자에게는
#   전이되지 않는 패턴이므로 여기서 규칙을 유도하지 않는다.
