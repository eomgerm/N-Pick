# 질의 정규화 규칙 (S15P21A501-43).
#
# ⚠ 이 파일의 값이 하나라도 바뀌면 normalization_version 이 바뀌고,
#    그 순간 그때까지 쌓인 장면 제외 규칙의 exact 매칭이 전부 끊긴다.
#    (`search_execution.normalization_version` 주석 참고)
#    규칙을 바꿀 때는 이 파일을 v2 로 복사하고 변경 근거를 남긴다.
#
# ── 이 사전의 출처 ──────────────────────────────────────────────────
#
# [질의 코퍼스] AI Hub 「018. 음성인식에 의한 영상 요약 데이터」(솔트룩스, 2023)
#   `highlight[].user_query[].query` 28,029 건. TBS 뉴스 영상에 대해 사람이 직접
#   쓴 검색 질의라 우리 사용자(편집기자)의 질의와 성격이 같다.
#   불용어의 백분율은 전부 이 코퍼스의 document frequency 다.
#
# [문서 코퍼스] AI Hub 「017. 한국어 텍스트-비디오-사운드 데이터」
#   뉴스 대사·요약 15,526 문장(3,000 파일 표본). 질의가 없어 불용어는 못 뽑지만,
#   별칭을 **독립적으로 교차 검증**하는 데 썼다. 두 코퍼스에서 방향이 일치했다
#   (예: 서울 493 / 서울시 105 / 서울특별시 1).
#
# [쓰지 않은 것] AI Hub 「042. 동영상 콘텐츠 하이라이트 편집 및 설명(요약)」 KBS
#   news_footage 10,504 건. 400 개 표본을 전수 확인한 결과 한글 텍스트가
#   metadata.license("방송사 귀속") 하나뿐이고 나머지는 카테고리 코드
#   (place=16, action=54 …)라 어휘 근거로 쓸 수 없다.
#
# 채택 기준:
#   - 불용어 : 질의의 "요청 행위" 를 나타내는 말만. 주제일 가능성이 있으면 남긴다.
#   - 매체어 : 질의 코퍼스 DF >= 10 인 것만. 추측으로 늘리지 않는다.
#   - 별칭   : 열거 가능한 공식 목록(행정구역명·정부조직법)이 있고, 두 코퍼스에서
#              두 표기가 모두 관측된 쌍만. 한쪽만 나오면 변이라고 보지 않는다.

schema = "query-norm/v1"

# 지문 재료로 남길 품사. Kiwi 태그 기준이며 여기 없는 태그는 전부 버린다.
#   NNG 일반명사 · NNP 고유명사 · SL 외국어 · SN 숫자 · VV 동사 · VA 형용사
# 조사(J*)·어미(E*)·기호(S*)는 이 목록에 없으므로 자동으로 걸러진다.
# kiwipiepy 내장 Stopwords 를 쓰지 않는 이유: 100개 중 84개가 이 필터로 이미
# 제거되고, 남는 16개에 '사람'·'지역'·'일'·'때'·'말' 이 들어 있다. 뉴스 검색에서
# 지우면 안 되는 단어들이라 그대로 쓸 수 없다.
keep_pos = ["NNG", "NNP", "SL", "SN", "VV", "VA"]

# 토큰을 사전순으로 정렬한다. "부산 침수" 와 "침수 부산" 을 같은 검색으로 본다.
# BM25 는 bag-of-words 라 순서를 잃어도 검색 품질에 손해가 없고, 정렬하지 않으면
# 어순만 다른 질의마다 다른 지문이 생겨 같은 규칙을 몇 번씩 만들게 된다.
sort_tokens = true

# 검색 군더더기. "형태/품사태그" 로 쓰며 형태는 Kiwi 어간이다("찾아줘" → "찾").
# 주석의 백분율은 위 코퍼스의 DF 다.
stopwords = [
  # 요청 행위 동사·형용사
  "대하/VV",    # 16.8%  "~에 대해 알려 줘"
  "알리/VV",    # 14.9%  "알려 줘"
  "있/VA",      # 12.2%  "~영상 있어?"
  "하/VV",      # 11.6%  "설명 해 줘"
  "보이/VV",    #  7.4%  "보여 줘"
  "알/VV",      #  6.7%  "알고 싶어"
  "되/VV",      #  6.3%
  "찾/VV",      #  5.8%  "찾아 줘"
  "있/VV",      #  5.4%
  "위하/VV",    #  3.6%
  "나오/VV",    #  1.9%  "~나오는 장면"
  "보/VV",      #  1.7%
  "관하/VV",    #  1.6%  "~에 관한"
  "궁금하/VA",  #  1.6%  "~궁금해"
  # 질의 형식 명사
  "영상/NNG",   # 10.8%
  "이유/NNG",   #  6.2%  문맥 표본 검사에서 92% 가 "~한 이유가 뭐야" 형식이었다
  "설명/NNG",   #  5.9%
  "장면/NNG",   #  3.8%
  "관련/NNG",   #  3.1%  "~관련 영상"
  "부분/NNG",   #  2.3%  "~하는 부분 필요해"
  "필요/NNG",   #  2.3%
  "내용/NNG",   #  1.6%
  "동영상/NNG", #  0.05% 빈도는 낮지만 매체어로 모호하지 않다
]

# 남겨 둔 경계 사례 — 코퍼스로 재판정하기 전에는 건드리지 않는다.
#   말/NNG     5.1%  형식어("무슨 말이야") 비율이 3% 에 그쳤다
#   이야기/NNG 2.6%  형식어 비율 68%. 애매해서 보류
#   곳/NNG     2.3%  형식어 비율 40%. "사고가 난 곳" 은 장소 조건이다
#   사람·지역·일·때·문제  전부 뉴스 검색의 주제어다

# Kiwi 가 한 토큰으로 보게 강제할 단어.
#
# 토큰 경계는 문맥에 따라 흔들린다. "서울특별시" 는 홀로 두면 NNP 한 토큰이지만
# "서울특별시 집중호우" 에서는 "서울"+"특별시" 로 쪼개진다(실측). 그러면 아래 별칭
# 키가 걸리지 않고 "특별시" 가 지문에 남는다. 여기 등록하면 문맥과 무관하게 고정된다.
#
# 등록해도 더 긴 단어는 안전하다 — "부산시" 를 등록해도 "부산시청 집회" 는 여전히
# "부산"+"시청"+"집회" 로 쪼개진다(실측). 아래 목록은 별칭 키와 1:1로 맞춘다.
user_words = [
  "서울특별시", "서울시",
  "부산광역시", "부산시",
  "대구광역시", "대구시",
  "인천광역시", "인천시",
  "광주광역시",
  "대전광역시", "대전시",
  "울산광역시", "울산시",
  "강원특별자치도", "강원도",
  "충청북도", "충청남도",
  "전북특별자치도", "전라북도", "전라남도",
  "경상북도", "경상남도",
  "제주특별자치도", "제주도",
  "행정안전부", "기획재정부", "보건복지부", "국토교통부",
  "문화체육관광부", "고용노동부", "여성가족부",
  "금융감독원", "공정거래위원회", "국가정보원",
  # 별칭 **값** 도 넣는다. 치환은 형태소 분석 뒤라서 키의 표층형이 뒤따르는 단어의
  # 분절까지 바꾼다. 값이 빠지면 "부산시 교통사고"(교통사고 부산)와 "부산 교통사고"
  # (교통 부산 사고)가 갈렸다 — 별칭 34개 × 꼬리말 20개에서 38건 비수렴.
  "강원", "경남", "경북", "고용부", "공정위", "광주", "국정원", "국토부", "금감원", "기재부", "대구", "대전", "문체부",
  "복지부", "부산", "서울", "여가부", "울산", "인천", "전남", "전북", "제주", "충남", "충북", "행안부",
]

# 사용자 사전 가산점. 0 이면 문맥에 따라 여전히 쪼개진다 — "보건복지부 기자회견" 이
# "보건"+"복지"+"부" 로 갈렸다. 3.0 에서 위 스윕이 38 → 0 이 된다.
user_word_score = 3.0

# 별칭. **형태소 분석 후 토큰 정확 일치** 로 걸리며(부분 문자열 아님) 불용어 필터보다
# 먼저 적용된다. 반대 순서면 '영상물'(별칭 → '영상')은 필터를 통과해 매체어가 지문에
# 남고 '영상'은 거부되어 같은 뜻인데 결과가 갈린다.
#
# 치환은 토큰당 한 번이다. 값으로 다른 별칭의 키를 쓰면(A→B, B→C) 로딩이 거부된다.
# 그리고 **치환해도 품사 태그는 원래 토큰의 것을 유지한다.** 별칭 대상이 불용어이기도
# 하다면 불용어 항목의 태그를 원본 쪽 태그로 적어야 걸린다.
# 그래서 "부산시" 규칙이 "부산시청" 을 건드리지 않는다 — Kiwi 가 "부산시청" 을
# NNP 한 토큰으로 잡기 때문이다. 키는 전부 단일 토큰인지 확인한 것만 넣는다.
#
# 코퍼스에서 실제로 확인된 표기 변이만 넣었다. 예: 서울(1,724) / 서울시(932) /
# 서울특별시(19) 가 같은 대상을 가리킨다. 짧은 쪽이 가장 빈번하므로 그쪽으로 모은다.
# 광역자치단체 정식 명칭은 공식 행정구역명이라 열거·검증이 가능하다.
#
# 일부러 넣지 않은 것:
#   경기도 → 경기      "경기" 가 스포츠 경기와 충돌한다
#   광주시 → 광주      경기도 광주시와 광주광역시가 갈린다 (광주광역시만 넣었다)
#   세종특별자치시     Kiwi 가 "세종특별자치"+"시" 로 쪼개 토큰 일치가 안 걸린다
#   코로나19/COVID-19  코퍼스 28,029 건에서 "코로나"(1,142) 외 표기가 0 건이었다
[aliases]
"서울특별시" = "서울"
"서울시" = "서울"
"부산광역시" = "부산"
"부산시" = "부산"
"대구광역시" = "대구"
"대구시" = "대구"
"인천광역시" = "인천"
"인천시" = "인천"
"광주광역시" = "광주"
"대전광역시" = "대전"
"대전시" = "대전"
"울산광역시" = "울산"
"울산시" = "울산"
"강원특별자치도" = "강원"
"강원도" = "강원"
"충청북도" = "충북"
"충청남도" = "충남"
"전북특별자치도" = "전북"
"전라북도" = "전북"
"전라남도" = "전남"
"경상북도" = "경북"
"경상남도" = "경남"
"제주특별자치도" = "제주"
"제주도" = "제주"

# 정부부처·기관 약칭.
#
# 부처 목록은 정부조직법으로 열거된다. 문제는 **약칭에 공식 목록이 없다**는 것이다
# (행정표준코드 code.go.kr 는 정식 명칭만 준다). 그래서 열거한 전 부처를 두 코퍼스에
# 대조해, 정식·약칭이 **양쪽 다 3회 이상** 관측된 쌍만 넣었다.
#
