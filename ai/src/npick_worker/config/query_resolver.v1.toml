# Gate B 미동결. 결정론에 가깝게 두려고 0 으로 시작한다 — 같은 질의가 실행마다
# 다르게 해석되면 snapshot 을 비교할 수 없다(FRD §6.4).
temperature = 0.0
# 출력이 잘리면 JSON 파싱이 깨져 RESOLVER_SCHEMA_INVALID 가 된다. 20개 대표 질의
# 실측 후 조정한다.
max_output_tokens = 2048
# FR-QRY-023: 동기 retry 를 하지 않는다. 이 값은 검색 p95 목표(NFR-PERF-001, 10초)
# 안에 들어야 하며 benchmark 후 동결한다.
timeout_seconds = 8.0
