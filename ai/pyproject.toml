[project]
name = "npick-worker"
version = "0.1.0"
description = "N-Pick AI pipeline worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "av>=18,<19",
    "scenedetect-headless>=0.7.1,<0.8",
]

[project.scripts]
npick-worker = "npick_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npick_worker"]

# ── 의존성 그룹 ──────────────────────────────────────────────────────
# dev 는 기본 설치, gpu 는 opt-in. `uv sync` 만 하면 torch 를 받지 않는다.
[dependency-groups]
dev = [
    "numpy>=2,<3",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx2>=2,<3",
]
gpu = [
    "torch>=2.13,<3",
    "faster-whisper>=1.2,<2",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"] # gpu 는 --group gpu 로만 설치된다

# PyPI 의 win_amd64 torch 휠은 CPU 전용이다(약 122MB). CUDA 는 이 인덱스에서만 온다.
# explicit=true 로 torch 이외 패키지에는 절대 쓰이지 않게 막는다.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# macOS 는 CUDA 휠이 존재하지 않으므로 marker 로 제외한다 → PyPI 의 arm64(MPS) 휠로 해석된다.
# 이 marker 가 없으면 macOS 팀원의 `uv sync` 가 해상도 단계에서 실패한다.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# ── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "TID", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["npick_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# gpu 그룹 미설치 환경에서도 mypy 가 돌아야 한다
module = ["torch.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySceneDetect 는 py.typed 를 배포하지 않는다. 경계는 detector.py 의 Protocol 이
# 잡으므로 타입 부재가 pyscenedetect_backend.py 밖으로 번지지 않는다.
module = ["scenedetect.*"]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# -m 'not smoke' 는 커맨드라인 `-m smoke` 가 덮는다(pytest 의 -m 은 단일 값).
addopts = "-ra --strict-markers --strict-config -m 'not smoke'"
markers = [
    "smoke: 실제 모델 로딩·GPU 확인. 기본 실행에서 제외되며 `-m smoke` 로만 실행한다",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
