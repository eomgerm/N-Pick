# Git 훅 설정. 전체 규칙 문서: .github/CONTRIBUTING.md
# 최초 1회 활성화: npm install  (prepare 스크립트가 lefthook install 을 실행)
#
# 검사 로직은 scripts/git-rules.cjs 한 파일에 모여 있다.

# 브랜치 이름 검사를 pre-commit이 아닌 prepare-commit-msg에 둔 이유:
# lefthook은 스테이징된 파일이 없으면 pre-commit 커맨드를 건너뛰는데,
# 브랜치 이름은 파일과 무관하게 항상 검사해야 하기 때문이다.
prepare-commit-msg:
  piped: true # 앞 커맨드가 실패하면 뒤는 실행하지 않는다
  commands:
    branch-name:
      priority: 1
      run: node scripts/git-rules.cjs branch
    issue-number:
      priority: 2
      run: node scripts/git-rules.cjs prepare {1} {2}

commit-msg:
  commands:
    format:
      run: node scripts/git-rules.cjs verify {1}

# 포맷터(eslint / spotless 등)가 필요해지면 여기에 추가한다.
#
# ai-ruff 주의사항:
#  - lefthook 은 저장소 루트에서 실행되고 {staged_files} 는 `ai/src/...` 처럼 루트 기준 경로다.
#    그래서 CWD 를 바꾸는 `--directory` 가 아니라 venv 만 바꾸는 `--project` 를 쓴다.
#  - check --fix 와 format 을 한 엔트리에 묶는 이유: 엔트리를 쪼개면 parallel 아래에서
#    같은 파일에 동시에 쓰며 stage_fixed 가 경합한다.
#  - 클론 직후 첫 커밋은 uv 가 venv 를 자동 생성하느라 느리다. `uv sync --directory ai` 를 먼저 돌린다.
pre-commit:
  parallel: true
  commands:
    ai-ruff:
      glob: "ai/**/*.py"
      run: uv run --project ai ruff check --fix {staged_files} && uv run --project ai ruff format {staged_files}
      stage_fixed: true
#   lint-fe:
#     glob: "fe/**/*.{ts,tsx}"
#     run: npx eslint {staged_files} --fix
#     stage_fixed: true
